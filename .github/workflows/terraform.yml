name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Terraform workspace
        required: true
        type: choice
        options:
          - app-field-vision-dev
          - app-field-vision-prod
          - app-field-vision-qa
          - app-max-nprd
          - app-max-prod
          - app-mfix-dev
          - app-mfix-prod
          - app-mfix-qa
          - app-miq-dev
          - app-miq-prod
          - app-miq-qa
          - app-mtid-nprd
          - app-mtid-prod
          - app-neo-dev
          - app-neo-prod
          - app-neo-qa
          - app-qwest-dev
          - app-qwest-prod
          - app-qwest-qa
          - hub-nprd
          - hub-prod
          - spokes-nprd
          - spokes-prod
          - temp-sec-hub-nprd
      action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true

concurrency:
  group: terraform-${{ inputs.workspace }}
  cancel-in-progress: false

jobs:

  plan:
    name: Terraform Plan
    runs-on: self-hosted

    environment:
      name: ${{ endsWith(inputs.workspace, '-dev') && 'dev' || endsWith(inputs.workspace, '-qa') && 'qa' || endsWith(inputs.workspace, '-nprd') && 'nprd' || 'prod' }}

    outputs:
      workspace: ${{ steps.config.outputs.workspace }}
      environment: ${{ steps.config.outputs.environment }}
      subscription_id: ${{ steps.config.outputs.subscription_id }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Workspace
        id: config
        shell: bash
        run: |
          WORKSPACE="${{ inputs.workspace }}"

          case "$WORKSPACE" in
            *-dev)  ENVIRONMENT="dev" ;;
            *-qa)   ENVIRONMENT="qa" ;;
            *-nprd) ENVIRONMENT="nprd" ;;
            *-prod) ENVIRONMENT="prod" ;;
            *)
              echo "Invalid workspace"
              exit 1
              ;;
          esac

          case "$WORKSPACE" in
            hub-*|temp-sec-hub-*)
              SUBSCRIPTION_ID="bbdd541c-ac30-44a8-b251-6ceb0006dda0"
              ;;
            *-prod)
              SUBSCRIPTION_ID="d295d8ec-ed35-4e10-b1a1-3341172cd12b"
              ;;
            *)
              SUBSCRIPTION_ID="bf123e28-0e1e-4698-9178-3489e42b1527"
              ;;
          esac

          TFVARS="environments/${WORKSPACE}/terraform.tfvars"

          if [ ! -f "$TFVARS" ]; then
            echo "Missing $TFVARS"
            exit 1
          fi

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.config.outputs.subscription_id }}

      - name: Terraform Backend Init
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
        run: |
          chmod +x scripts/terraform-backend-init.sh
          ./scripts/terraform-backend-init.sh "${{ inputs.workspace }}"

      - name: Terraform Plan
        shell: bash
        env:
          TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_subscription_id: ${{ steps.config.outputs.subscription_id }}
          TF_VAR_qg_shared_client_id: ${{ secrets.QG_SHARED_CLIENT_ID }}
          TF_VAR_qg_shared_client_secret: ${{ secrets.QG_SHARED_CLIENT_SECRET }}
        run: |
          chmod +x scripts/plan.sh
          ./scripts/plan.sh "${{ inputs.workspace }}"

      - name: Upload Plan
        if: inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.workspace }}-${{ github.run_id }}
          path: "${{ inputs.workspace }}.tfplan"
          retention-days: 1


  apply:
    name: Terraform Apply
    needs: plan
    if: inputs.action == 'apply'

    runs-on: self-hosted

    environment:
      name: ${{ needs.plan.outputs.environment }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ needs.plan.outputs.subscription_id }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.plan.outputs.workspace }}-${{ github.run_id }}

      - name: Terraform Backend Init
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
        run: |
          chmod +x scripts/terraform-backend-init.sh
          ./scripts/terraform-backend-init.sh \
            "${{ needs.plan.outputs.workspace }}"

      - name: Terraform Apply
        shell: bash
        env:
          TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_subscription_id: ${{ needs.plan.outputs.subscription_id }}
          TF_VAR_qg_shared_client_id: ${{ secrets.QG_SHARED_CLIENT_ID }}
          TF_VAR_qg_shared_client_secret: ${{ secrets.QG_SHARED_CLIENT_SECRET }}
        run: |
          chmod +x scripts/apply.sh
          ./scripts/apply.sh \
            "${{ needs.plan.outputs.workspace }}" 