name: Test GitHub Actions Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      custom_message:
        description: "A custom test message to print"
        required: false
        default: "Hello from manual trigger!"

jobs:
  test-run:
    name: Run Test Steps
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Run a one-line script
        run: echo "GitHub Actions workflow executed successfully!"

      - name: Print event details and context
        run: |
          echo "Triggered by event: ${{ github.event_name }}"
          echo "Triggered by actor: ${{ github.actor }}"
          echo "Git commit SHA: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow Run ID: ${{ github.run_id }}"

      - name: Print custom message (if manually triggered)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Custom message: ${{ inputs.custom_message }}"

      - name: Run multi-line test checks
        run: |
          echo "Current Date & Time: $(date)"
          echo "Runner OS: $(uname -s)"
          echo "Runner Architecture: $(uname -m)"
          ls -la
