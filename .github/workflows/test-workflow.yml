name: Manual Test

on:
  workflow_dispatch:
    inputs:
      custom_message:
        description: Message to print
        required: false
        default: Hello from the manual test workflow

jobs:
  test:
    name: Run manual test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run test
        env:
          CUSTOM_MESSAGE: ${{ inputs.custom_message }}
        run: |
          echo "$CUSTOM_MESSAGE"
          echo "Manual workflow ran successfully."
